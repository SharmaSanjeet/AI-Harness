# Reference reverse proxy for LedgerLens (see DEPLOYMENT.md, "Reverse proxy & TLS").
# Mount your certs into ./certs/fullchain.pem and ./certs/privkey.pem and run:
#   docker compose --profile tls up -d

events { }

http {
  server_tokens off;
  client_max_body_size 1m;

  # 30 requests/min per client IP, short bursts allowed — the UI polls a few
  # endpoints per run; analyses are POST /analyze and take seconds, not ms.
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

  server {
    listen 8443 ssl;
    http2 on;
    server_name ledgerlens.example.com;   # set to your hostname

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://app:8083;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;   # analyses can take ~15 s when the model loads cold
    }
  }
}
