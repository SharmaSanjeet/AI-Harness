# LedgerLens — single-node production stack: app + Postgres + local Ollama.
# Usage (from the deploy/ directory):
#   cp .env.production.example .env   # then fill in real values
#   docker compose up -d --build
#   docker compose logs -f ollama-init    # wait for the model pull
#   curl http://localhost:${APP_PORT:-8083}/health
# TLS termination via the bundled nginx: docker compose --profile tls up -d

name: ledgerlens

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # GPU (NVIDIA + nvidia-container-toolkit installed): uncomment below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c",
      "sleep 5 && OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ledgerlens:${POSTGRES_PASSWORD}@db:5432/ledgerlens
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      ENABLE_ADMIN_RESET: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8083}:8083"

  nginx:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  pgdata:
  ollama_models:
